name: Release

on:
  push:
    tags:
    - '*.*.*'
  # A manual run builds, tests and packs, but does not publish to nuget.org
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 100

      # Install all SDK versions targeted in DomainResults.MVC project
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          7.x
          8.x
          9.x
          10.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Pack DomainResult (Common)
      run: dotnet pack ./src/Common/DomainResults.Common.csproj --output nuget-packages --configuration Release
    - name: Pack DomainResult (full)
      run: dotnet pack ./src/Mvc/DomainResults.Mvc.csproj --output nuget-packages --configuration Release

    - name: Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: nuget-packages/**/*

  # A separate job keeps the OIDC token away from the restore, build and test steps.
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The nuget.org policy names this environment, so it refuses tokens from other jobs
    environment: nuget
    permissions:
      # Trusted publishing on nuget.org needs the GitHub OIDC token
      id-token: write

    steps:
    - name: Download packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: nuget-packages
    # Trusted publishing exchanges the GitHub OIDC token for a short-lived API key.
    # It needs a matching policy on nuget.org (https://learn.microsoft.com/nuget/nuget-org/trusted-publishing).
    - name: NuGet login
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        # The nuget.org profile name of the package owner
        user: AlexKlaus
    - name: NuGet publish
      run: find nuget-packages -name '*.nupkg' | xargs -i dotnet nuget push {} --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
