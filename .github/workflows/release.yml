name: Release

on:
  push:
    tags:
    - '*.*.*'
  # A manual run builds, tests and packs, but does not publish to nuget.org
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # MinVer needs the tags, and package validation needs the version from them
        fetch-depth: 0

      # Install all SDK versions targeted in DomainResults.MVC project
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          7.x
          8.x
          9.x
          10.x

    - name: Install dependencies
      run: dotnet restore

    # Package validation must compare the release with the previous release
    - name: Check the package validation baseline
      run: |
        previous=$(git describe --tags --abbrev=0 --match 'v*.*.*' HEAD^)
        baseline=$(dotnet msbuild src/Common -getProperty:PackageValidationBaselineVersion)
        if [ "v$baseline" != "$previous" ]; then
          echo "::error::The baseline is $baseline, but the previous release is $previous."
          exit 1
        fi

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Pack DomainResult (Common)
      run: dotnet pack ./src/Common/DomainResults.Common.csproj --output nuget-packages --configuration Release
    - name: Pack DomainResult (full)
      run: dotnet pack ./src/Mvc/DomainResults.Mvc.csproj --output nuget-packages --configuration Release
    - name: NuGet publish
      if: github.event_name == 'push'
      run: find nuget-packages -name '*.nupkg' | xargs -i dotnet nuget push {} --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

    - name: Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: nuget-packages/**/*
